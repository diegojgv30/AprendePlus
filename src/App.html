/* =========================================
   ICONOS Y UTILIDADES
========================================= */

function icon(name, size = 20, extraClass = '') {
  return `<i data-lucide="${name}" width="${size}" height="${size}" class="${extraClass}" aria-hidden="true"></i>`;
}

function refreshIcons() {
  if (window.lucide) {
    lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
  }
}

function getSkillIcon(skill) {
  return {
    Listening: 'headphones',
    Speaking: 'mic',
    Reading: 'book-open',
    Writing: 'pen-line'
  }[skill] || 'book';
}

function getSkillClass(skill) {
  return 'tag-' + String(skill || '').toLowerCase();
}

function getInitials(name) {
  return String(name || 'Estudiante')
    .split(' ')
    .map(part => part.charAt(0))
    .slice(0, 2)
    .join('')
    .toUpperCase();
}

function skillIconHTML(skill, size = 22) {
  return `<span class="icon-wrapper ${getSkillClass(skill)}">${icon(getSkillIcon(skill), size)}</span>`;
}

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');

  const toastIcon = type === 'error'
    ? 'alert-circle'
    : type === 'success'
      ? 'check-circle'
      : 'info';

  toast.innerHTML = `${icon(toastIcon, 18)}<span>${escapeHTML(message)}</span>`;
  container.appendChild(toast);
  refreshIcons();

  setTimeout(() => toast.remove(), 3500);
}

function hideLoading() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
}

function showLoading() {
  document.getElementById('loading-screen').classList.remove('hidden');
  document.getElementById('main-app').classList.add('hidden');
}

function serverCall(functionName, args, success, failure) {
  let runner = google.script.run
    .withFailureHandler(function(error) {
      console.error(error);
      if (failure) failure(error);
      else showToast('Ocurrió un error de comunicación.', 'error');
    })
    .withSuccessHandler(function(result) {
      if (success) success(result);
    });

  runner[functionName].apply(runner, args || []);
}


function readableFeedback(feedback) {
  if (!feedback) return '';

  let value = feedback;

  // Intentar interpretar cadenas que contienen JSON.
  if (typeof value === 'string') {
    value = value.trim();

    if (!value) return '';

    if (
      (value.startsWith('[') && value.endsWith(']')) ||
      (value.startsWith('{') && value.endsWith('}'))
    ) {
      try {
        value = JSON.parse(value);
      } catch (error) {
        return value;
      }
    } else {
      return value;
    }
  }

  // Si el resultado es una lista de respuestas.
  if (Array.isArray(value)) {
    const total = value.length;

    const correct = value.filter(item =>
      item && (
        item.correct === true ||
        item.isCorrect === true
      )
    ).length;

    if (total > 0) {
      return `Respondiste correctamente ${correct} de ${total} preguntas.`;
    }

    return '';
  }

  // Si es un objeto con información de evaluación.
  if (typeof value === 'object') {
    if (typeof value.message === 'string') {
      return value.message;
    }

    if (typeof value.summary === 'string') {
      return value.summary;
    }

    if (typeof value.feedback === 'string') {
      return readableFeedback(value.feedback);
    }
  }

  return '';
}



/* =========================================
   ACTIVIDADES COMBINADAS
========================================= */

function getActivitySkills(activity) {
  if (!activity) return [];

  if (activity.parts && Object.keys(activity.parts).length) {
    return Object.keys(activity.parts);
  }

  if (Array.isArray(activity.skills) && activity.skills.length) {
    return activity.skills;
  }

  return activity.skill ? [activity.skill] : [];
}

function getActivityPart(activity, skill) {
  if (activity && activity.parts && activity.parts[skill]) {
    return activity.parts[skill];
  }

  return {
    instructions: activity.instructions || '',
    content: activity.content || '',
    prompt: activity.content || '',
    questions: activity.questions || []
  };
}

function getSkillResult(activityId, skill) {
  return (App.activityResults[activityId] || {})[skill] || null;
}

/**
 * Determina si un resultado candidato es más reciente que el guardado.
 * No depende del orden en que el backend devuelva los registros.
 */
function isMoreRecentResult(candidate, current) {
  if (!candidate) return false;
  if (!current) return true;

  const candidateDate = candidate.date || candidate.createdAt || candidate.created_at;
  const currentDate = current.date || current.createdAt || current.created_at;

  if (!candidateDate) return false;
  if (!currentDate) return true;

  const candidateTime = new Date(candidateDate).getTime();
  const currentTime = new Date(currentDate).getTime();

  if (!Number.isFinite(candidateTime)) return false;
  if (!Number.isFinite(currentTime)) return true;

  return candidateTime > currentTime;
}

function storeLatestActivityResult(activityId, skill, record) {
  if (!activityId || !skill || !record) return;

  if (!App.activityResults[activityId]) {
    App.activityResults[activityId] = {};
  }

  const current = App.activityResults[activityId][skill];

  if (isMoreRecentResult(record, current)) {
    App.activityResults[activityId][skill] = record;
  }
}

function saveLocalActivityResult(activityId, skill, result) {
  if (!App.activityResults[activityId]) {
    App.activityResults[activityId] = {};
  }

  App.activityResults[activityId][skill] = {
    score: Number(result.score || 0),
    percentage: Number(
      result.percentage !== undefined
        ? result.percentage
        : result.score || 0
    ),
    maxScore: result.maxScore || 100,
    feedback: result.feedback || '',
    strengths: Array.isArray(result.strengths) ? result.strengths : [],
    improvements: Array.isArray(result.improvements) ? result.improvements : [],
    recommendation: result.recommendation || '',
    correct: result.correct,
    total: result.total,
    date: new Date().toISOString()
  };
}

function loadActivityResults(callback) {
  serverCall(
    'getProgress',
    [App.token],
    function(result) {
      if (result && result.success) {
        App.activityResults = {};

        (result.records || []).forEach(function(record) {
          const activityId = record.activityId;
          const skill = record.skill;

          if (!activityId || !skill) return;

          storeLatestActivityResult(activityId, skill, record);
        });

        App.dashboard = result.dashboard || App.dashboard;
      }

      if (callback) callback();
    },
    function() {
      if (callback) callback();
    }
  );
}

function getActivityCompletion(activity) {
  const skills = getActivitySkills(activity);
  const completed = skills.filter(skill =>
    Boolean(getSkillResult(activity.id, skill))
  );

  return {
    total: skills.length,
    completed: completed.length,
    pending: skills.filter(skill =>
      !getSkillResult(activity.id, skill)
    ),
    isComplete: skills.length > 0 && completed.length === skills.length
  };
}

   INTEGRACIÓN CON GRABADOR DE GITHUB PAGES

const RECORDER_URL = 'https://diegojgv30.github.io/grabadorAprende-/';

window.addEventListener('message', handleRecorderMessage);

function handleRecorderMessage(event) {
  // Solo aceptar mensajes de la ventana que abrió Aprende+.
  if (!App.recorderWindow || event.source !== App.recorderWindow) return;

  // Verificar el origen del grabador.
  if (event.origin !== 'https://diegojgv30.github.io') return;

  const data = event.data || {};

  if (data.app !== 'APRENDE_PLUS_RECORDER') return;

  // El grabador informa que está listo.
  if (data.type === 'RECORDER_READY') {
    if (!App.currentActivity) return;

    App.recorderOrigin = event.origin;

    App.recorderWindow.postMessage({
      app: 'APRENDE_PLUS_RECORDER',
      type: 'RECORDER_INIT',
      token: App.token,
      activityId: App.currentActivity.id
    }, App.recorderOrigin);

    const status = document.getElementById('recorder-status');

    if (status) {
      status.textContent = 'Grabador conectado. Completa tu grabación en la otra pestaña.';
    }

    return;
  }

  // El grabador envía el audio.
  if (data.type === 'RECORDER_AUDIO') {
    if (App.recorderProcessing) return;

    if (!App.currentActivity ||
        data.activityId !== App.currentActivity.id) {
      showToast('La grabación no corresponde a esta actividad.', 'error');
      return;
    }

    if (!data.base64 || !data.mimeType) {
      showToast('No se recibió un archivo de audio válido.', 'error');
      return;
    }

    processRecorderAudio(data.base64, data.mimeType);
  }
}


/* =========================================
   ABRIR GRABADOR EXTERNO
========================================= */

function openRecorder() {
  if (!App.currentActivity) {
    showToast('No hay una actividad seleccionada.', 'error');
    return;
  }

  if (App.recorderWindow && !App.recorderWindow.closed) {
    App.recorderWindow.focus();
    return;
  }

  // Debe ejecutarse directamente desde el clic del usuario.
  const popup = window.open(
    RECORDER_URL,
    '_blank'
  );

  if (!popup) {
    showToast(
      'El navegador bloqueó la nueva pestaña. Permite las ventanas emergentes para Aprende+.',
      'error'
    );
    return;
  }

  App.recorderWindow = popup;
  App.recorderOrigin = null;
  App.recorderProcessing = false;

  const status = document.getElementById('recorder-status');

  if (status) {
    status.textContent = 'Esperando conexión con el grabador...';
  }

  const button = document.getElementById('open-recorder-button');

  if (button) {
    button.disabled = true;
    button.innerHTML = 'Grabador abierto';
  }

  // Comprobar si el usuario cierra la pestaña sin enviar audio.
  const checkWindow = setInterval(function() {
    if (!App.recorderWindow || App.recorderWindow.closed) {
      clearInterval(checkWindow);

      App.recorderWindow = null;
      App.recorderOrigin = null;

      const currentButton = document.getElementById('open-recorder-button');

      if (currentButton) {
        currentButton.disabled = false;
        currentButton.innerHTML = 'Abrir grabador nuevamente';
      }

      const currentStatus = document.getElementById('recorder-status');

      if (currentStatus && !App.recorderProcessing) {
        currentStatus.textContent = 'El grabador se cerró. Puedes abrirlo nuevamente.';
      }
    }
  }, 1000);
}


/* =========================================
   PROCESAR AUDIO RECIBIDO
========================================= */

function processRecorderAudio(base64, mimeType) {
  const activity = App.currentActivity;

  if (!activity) return;

  App.recorderProcessing = true;

  const button = document.getElementById('open-recorder-button');
  const status = document.getElementById('recorder-status');

  if (button) {
    button.disabled = true;
    button.innerHTML = 'Evaluando con IA...';
  }

  if (status) {
    status.textContent = 'Audio recibido. Evaluando tu pronunciación...';
  }

  serverCall(
    'evaluateSpeaking',
    [
      App.token,
      activity.id,
      base64,
      mimeType
    ],
    function(result) {
      if (!result || !result.success) {
        App.recorderProcessing = false;

        if (button) {
          button.disabled = false;
          button.innerHTML = 'Abrir grabador nuevamente';
        }

        if (status) {
          status.textContent = 'No fue posible evaluar el audio. Intenta nuevamente.';
        }

        showToast(
          result ? result.message : 'No fue posible evaluar el audio.',
          'error'
        );

        return;
      }

      saveLocalActivityResult(activity.id, 'Speaking', result);

      if (App.recorderWindow && !App.recorderWindow.closed) {
        App.recorderWindow.close();
      }

      App.recorderWindow = null;
      App.recorderOrigin = null;
      App.recorderProcessing = false;

      showToast('Speaking completado correctamente.', 'success');

      refreshDashboard(function() {
        renderActivity(activity);
      });
    },
    function() {
      App.recorderProcessing = false;

      if (button) {
        button.disabled = false;
        button.innerHTML = 'Abrir grabador nuevamente';
      }

      if (status) {
        status.textContent = 'Error de comunicación. Intenta nuevamente.';
      }
    }
  );
}

function handleLogin(event) {
  event.preventDefault();

  const code = document.getElementById('student-code').value;
  const pin = document.getElementById('student-pin').value;
  const button = document.getElementById('login-button');

  button.disabled = true;
  button.innerHTML = `<span>Ingresando...</span>${icon('loader-circle', 19)}`;
  refreshIcons();

  serverCall(
    'loginStudent',
    [code, pin],
    function(result) {
      button.disabled = false;

      if (!result || !result.success) {
        button.innerHTML = `<span>Iniciar sesión</span>${icon('arrow-right', 19)}`;
        refreshIcons();
        showToast(result ? result.message : 'No fue posible iniciar sesión.', 'error');
        return;
      }

      App.token = result.token;
      App.student = result.student;

      sessionStorage.setItem('aprende_token', result.token);
      loadApplication();
    },
    function() {
      button.disabled = false;
      button.innerHTML = `<span>Iniciar sesión</span>${icon('arrow-right', 19)}`;
      refreshIcons();
    }
  );
}

function loadApplication() {
  showLoading();

  serverCall(
    'getAppData',
    [App.token],
    function(result) {
      if (!result || !result.success) {
        sessionStorage.removeItem('aprende_token');
        App.token = '';
        showLogin();
        return;
      }

      App.student = result.student;
      App.activities = result.activities || [];
      App.dashboard = result.dashboard || {};
      App.activityResults = {};

      loadActivityResults(function() {
        renderLayout();
        navigate('home');
        hideLoading();
      });
    },
    function() {
      sessionStorage.removeItem('aprende_token');
      App.token = '';
      showLogin();
    }
  );
}

function navigate(page) {
  stopListeningAudio();
  resetRecording();

  App.currentPage = page;

  document.querySelectorAll('.nav-item[data-page]')
    .forEach(function(button) {

  else if (page === 'progress') renderProgress();

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPendingPart(activity, skill, part) {
  let content = '';

  if (skill === 'Listening' || skill === 'Reading') {
    content = renderQuiz(activity, skill, part);
  } else if (skill === 'Writing') {
    content = renderWriting(activity, part);
  } else if (skill === 'Speaking') {
    content = renderSpeaking(activity, part);
  }

  return `
    <section class="activity-skill-section">

      <div class="section-heading">
        <div>
          <span class="page-eyebrow">PARTE ${escapeHTML(skill.toUpperCase())}</span>

      ${part.instructions
        ? `<p class="page-subtitle">${escapeHTML(part.instructions)}</p>`
        : ''
      }

      ${content}

    </section>
  `;
}

function feedbackList(items) {
  if (!Array.isArray(items)) {
    if (typeof items === 'string' && items.trim()) return [items.trim()];
    return [];
  }
  return items.map(item => String(item || '').trim()).filter(Boolean);
}

function renderFeedbackPanel(skill, result) {
  if (!result) return '';
  const feedback = result.feedback;
  const isQuiz = skill === 'Listening' || skill === 'Reading';

  if (isQuiz && Array.isArray(feedback)) {
    const review = feedback.map(function(item, index) {
      const correct = item && item.correct === true;
      return `
        <div class="question-card" style="margin-top:12px;padding:15px;border:1px solid ${correct ? '#ccebdc' : '#f3d0d0'};background:${correct ? '#f3fbf7' : '#fff7f7'}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px">
            <strong>Pregunta ${index + 1}</strong>
            <span style="font-size:12px;font-weight:700;color:${correct ? '#168451' : '#c04444'}">${correct ? 'Correcta' : 'Necesita revisión'}</span>
          </div>
          <p style="margin:0 0 9px;font-weight:600">${escapeHTML(item.question || '')}</p>
          <p style="margin:5px 0;font-size:14px"><strong>Tu respuesta:</strong> ${escapeHTML(item.selected || 'Sin respuesta')}</p>
          ${!correct ? `<p style="margin:5px 0;font-size:14px"><strong>Respuesta correcta:</strong> ${escapeHTML(item.correctAnswer || '')}</p>` : ''}
          ${item.explanation ? `<p style="margin:9px 0 0;color:#536176;font-size:13px"><strong>¿Por qué?</strong> ${escapeHTML(item.explanation)}</p>` : ''}
        </div>`;
    }).join('');
    const correctCount = feedback.filter(item => item && item.correct === true).length;
    const total = feedback.length;
    return `
      <div class="question-card" style="margin-top:16px;padding:18px">
        <h3 style="margin:0 0 6px">Tu retroalimentación</h3>
        <p class="page-subtitle" style="margin:0">${correctCount} de ${total} respuestas correctas. Revisa cada pregunta para identificar qué necesitas reforzar.</p>
        ${review}
      </div>`;
  }

  const strengths = feedbackList(result.strengths);
  const improvements = feedbackList(result.improvements);
  const recommendation = typeof result.recommendation === 'string'
    ? result.recommendation
    : feedbackList(result.recommendation).join(' ');
  const general = typeof feedback === 'string'
    ? feedback
    : (feedback && typeof feedback === 'object'
      ? (feedback.summary || feedback.feedback || feedback.message || '')
      : '');

  if (!general && !strengths.length && !improvements.length && !recommendation) return '';

  const listHTML = function(items, emptyText) {
    return items.length
      ? `<ul style="margin:8px 0 0;padding-left:20px">${items.map(item => `<li style="margin:5px 0">${escapeHTML(item)}</li>`).join('')}</ul>`
      : `<p style="margin:8px 0 0;color:#68758a;font-size:13px">${emptyText}</p>`;
  };

  return `
    <div class="question-card" style="margin-top:16px;padding:18px">
      <h3 style="margin:0 0 10px">Tu retroalimentación</h3>
      ${general ? `<p class="page-subtitle" style="margin:0 0 14px">${escapeHTML(general)}</p>` : ''}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">
        <div style="padding:13px;border-radius:10px;background:#f1faf5">
          <strong style="color:#18794e">Lo que hiciste bien</strong>
          ${listHTML(strengths, 'Sigue practicando para identificar tus fortalezas.')}
        </div>
        <div style="padding:13px;border-radius:10px;background:#fff8ed">
          <strong style="color:#9a6418">Lo que puedes mejorar</strong>
          ${listHTML(improvements, 'Continúa practicando esta habilidad.')}
        </div>
      </div>
      ${recommendation ? `<div style="margin-top:14px;padding:13px;border-radius:10px;background:#f2f5ff"><strong>Tu siguiente paso</strong><p style="margin:7px 0 0">${escapeHTML(recommendation)}</p></div>` : ''}
    </div>`;
}

function renderCompletedPart(skill, result) {
  const percentage = Number(
    result.percentage !== undefined
      ? result.percentage
      : result.score || 0

  return `
    <section class="activity-skill-section completed-skill-section">

      <div class="question-card">

/* =========================================
   LISTENING: REPRODUCCIÓN DE AUDIO
========================================= */


/*
 * Reproducción de Listening con prioridad para voces
 * inglesas de mayor calidad disponibles en el navegador.
 */


function stopListeningAudio() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  App.speechUtterance = null;

  const button = document.getElementById('listen-button');

  if (button) {
    button.disabled = false;
    button.innerHTML = `${icon('volume-2', 19)}<span>Escuchar audio</span>`;
    refreshIcons();
  }
}


/**
 * Espera a que el navegador cargue sus voces.
 */
function getEnglishVoice() {
  return new Promise(function(resolve) {
    const synth = window.speechSynthesis;

    function selectVoice() {
      const voices = synth.getVoices();

      const englishVoices = voices.filter(voice =>
        /^en(-|_)/i.test(voice.lang)
      );

      if (!englishVoices.length) return null;

      function scoreVoice(voice) {
        const name = voice.name.toLowerCase();
        const lang = voice.lang.toLowerCase();

        let score = 0;

        if (lang === 'en-us') score += 30;
        else if (lang === 'en-gb') score += 15;

        if (/natural|neural/.test(name)) score += 100;
        if (/online/.test(name)) score += 40;

        if (/aria|jenny|guy|sara|ava|andrew|jane/.test(name)) {
          score += 20;
        }

        if (voice.localService === false) score += 10;

        return score;
      }

      englishVoices.sort((a, b) =>
        scoreVoice(b) - scoreVoice(a)
      );

      return englishVoices[0];
    }

    const initialVoice = selectVoice();

    if (initialVoice) {
      resolve(initialVoice);
      return;
    }

    let completed = false;

    function finish() {
      if (completed) return;

      completed = true;
      synth.removeEventListener('voiceschanged', finish);

      resolve(selectVoice());
    }

    synth.addEventListener('voiceschanged', finish);

    // Algunos navegadores tardan en cargar las voces.
    setTimeout(finish, 2500);
  });
}


/**
 * Reproduce el contenido de Listening.
 */
async function playListeningAudio() {
  const activity = App.currentActivity;

  if (!activity) return;

  const part = getActivityPart(activity, 'Listening');

  const textToRead = String(
    part.audioText ||
    part.content ||
    part.prompt ||
    ''
  ).trim();

  if (!textToRead) {
    showToast(
      'Esta actividad no tiene un texto de audio configurado.',
      'error'
    );
    return;
  }

  if (!('speechSynthesis' in window)) {
    showToast(
      'Tu navegador no admite reproducción de voz.',
      'error'
    );
    return;
  }

  stopListeningAudio();

  const button = document.getElementById('listen-button');

  if (button) {
    button.disabled = true;
    button.innerHTML =
      `${icon('loader-circle', 19)}<span>Cargando voz...</span>`;
    refreshIcons();
  }

  try {
    const voice = await getEnglishVoice();

    // Evitar reproducir una actividad diferente si el usuario navegó.
    if (App.currentActivity !== activity) return;

    const utterance = new SpeechSynthesisUtterance(textToRead);

    utterance.lang = voice ? voice.lang : 'en-US';
    utterance.rate = 0.90;
    utterance.pitch = 1;
    utterance.volume = 1;

    if (voice) {
      utterance.voice = voice;
      console.log('Voz seleccionada:', voice.name, voice.lang);
    } else {
      console.warn(
        'No hay voces inglesas disponibles.',
        window.speechSynthesis.getVoices()
      );

      showToast(
        'No hay una voz inglesa instalada. Se intentará utilizar la voz predeterminada.',
        'error'
      );
    }

    utterance.onstart = function() {
      if (button) {
        button.disabled = false;
        button.innerHTML =
          `${icon('volume-2', 19)}<span>Reproduciendo...</span>`;
        refreshIcons();
      }
    };

    utterance.onend = function() {
      App.speechUtterance = null;

      if (button) {
        button.disabled = false;
        button.innerHTML =
          `${icon('refresh-cw', 19)}<span>Escuchar nuevamente</span>`;
        refreshIcons();
      }
    };

    utterance.onerror = function(event) {
      console.error('Error de reproducción:', event);

  if (!questions.length) {
    showToast('Esta parte todavía no tiene preguntas configuradas.', 'error');

        button.innerHTML = `<span>Enviar respuestas</span>${icon('arrow-right', 19)}`;

function setRecordingStatus(message) {
  const status = document.getElementById('recording-status');
  if (status) status.textContent = message;
}

async function startRecording() {
  const recordButton = document.getElementById('record-button');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast(
      'El navegador no permite usar el micrófono en esta página. Abre la aplicación mediante HTTPS en Chrome o Edge.',
      'error'
    );
    setRecordingStatus('No se puede acceder al micrófono desde este navegador.');
    return;
  }

  if (typeof MediaRecorder === 'undefined') {
    showToast('Tu navegador no admite grabación de audio.', 'error');
    return;
  }

  if (!window.isSecureContext) {
    showToast('El micrófono requiere una conexión segura HTTPS.', 'error');
    setRecordingStatus('La conexión no es segura. Se necesita HTTPS.');
    return;
  }

  if (recordButton) {
    recordButton.disabled = true;
    recordButton.innerHTML = `${icon('loader-circle', 18)}<span>Solicitando permiso...</span>`;
    refreshIcons();
  }

  try {
    /*
     * Esta solicitud se ejecuta directamente como consecuencia
     * del clic del estudiante en el botón de grabación.
     */
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    App.recordingStream = stream;
    App.audioChunks = [];
    App.audioBlob = null;
    App.recordingSkill = 'Speaking';

    const mimeTypes = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4'
    ];

    const mimeType = mimeTypes.find(type =>
      MediaRecorder.isTypeSupported(type)
    );

    const recorder = mimeType
      ? new MediaRecorder(stream, { mimeType })
      : new MediaRecorder(stream);

    App.recorder = recorder;

    recorder.ondataavailable = function(event) {
      if (event.data && event.data.size > 0) {
        App.audioChunks.push(event.data);
      }
    };

    recorder.onerror = function(event) {
      console.error('Error de MediaRecorder:', event);
      showToast('Se produjo un error durante la grabación.', 'error');
      resetRecording();
    };

    recorder.onstop = function() {
      const finalType = recorder.mimeType || 'audio/webm';

      App.audioBlob = new Blob(App.audioChunks, {
        type: finalType
      });

      if (App.recordingStream) {
        App.recordingStream.getTracks().forEach(track => track.stop());
        App.recordingStream = null;
      }

      if (App.audioUrl) {
        URL.revokeObjectURL(App.audioUrl);
      }

      App.audioUrl = URL.createObjectURL(App.audioBlob);

      const preview = document.getElementById('audio-preview');

      if (preview) {
        preview.innerHTML = `
          <audio controls style="width:100%" preload="metadata">
            <source src="${App.audioUrl}" type="${escapeHTML(finalType)}">
            Tu navegador no puede reproducir este audio.
          </audio>
        `;
      }

      const evaluateButton = document.getElementById('evaluate-speaking-button');
      if (evaluateButton) evaluateButton.disabled = App.audioBlob.size === 0;

      const status = document.getElementById('recording-status');

      if (status) {
        status.textContent = App.audioBlob.size > 0
          ? 'Grabación lista. Escúchala antes de enviarla.'
          : 'No se capturó audio. Intenta grabar nuevamente.';
      }

      const stopButton = document.getElementById('stop-button');
      const startButton = document.getElementById('record-button');

      if (stopButton) stopButton.classList.add('hidden');

      if (startButton) {
        startButton.classList.remove('hidden');
        startButton.disabled = false;
        startButton.innerHTML = `${icon('refresh-cw', 18)}<span>Grabar nuevamente</span>`;
      }

      refreshIcons();
    };

    recorder.start();

    if (recordButton) {
      recordButton.classList.add('hidden');
    }

    const stopButton = document.getElementById('stop-button');
    if (stopButton) stopButton.classList.remove('hidden');

    setRecordingStatus('Grabando... habla en inglés.');
    const status = document.getElementById('recording-status');
    if (status) status.classList.add('recording-active');

  } catch (error) {
    console.error('Error al acceder al micrófono:', error);

    if (App.recordingStream) {
      App.recordingStream.getTracks().forEach(track => track.stop());
      App.recordingStream = null;
    }

    if (recordButton) {
      recordButton.disabled = false;
      recordButton.innerHTML = `${icon('mic', 18)}<span>Intentar nuevamente</span>`;
      refreshIcons();
    }

    let message = 'No se pudo acceder al micrófono.';

    switch (error.name) {
      case 'NotAllowedError':
      case 'PermissionDeniedError':
        message = 'Permiso denegado. Autoriza el micrófono en los permisos del sitio desde tu navegador.';
        break;

      case 'NotFoundError':
      case 'DevicesNotFoundError':
        message = 'No se encontró ningún micrófono conectado al dispositivo.';
        break;

      case 'NotReadableError':
      case 'TrackStartError':
        message = 'El micrófono está siendo utilizado por otra aplicación o no está disponible.';
        break;

      case 'OverconstrainedError':
        message = 'El micrófono no admite la configuración solicitada.';
        break;

      case 'SecurityError':
        message = 'El navegador bloqueó el acceso al micrófono por razones de seguridad.';
        break;

      case 'AbortError':
        message = 'La solicitud del micrófono fue interrumpida. Intenta nuevamente.';
        break;
    }

    setRecordingStatus(message);
    showToast(message, 'error');
  }
}

function stopRecording() {
  const recorder = App.recorder;

  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }

  const status = document.getElementById('recording-status');
  if (status) status.classList.remove('recording-active');
}

async function submitSpeaking() {
  if (!App.audioBlob || App.audioBlob.size === 0) {
    showToast('Primero debes grabar tu respuesta.', 'error');
    return;
  }

  if (App.audioBlob.size > 8 * 1024 * 1024) {
    showToast('El audio es demasiado grande. Graba una respuesta más corta.', 'error');
    return;
  }

  const button = document.getElementById('evaluate-speaking-button');
  if (!button) return;

  button.disabled = true;
  button.innerHTML = `<span>Evaluando con IA...</span>${icon('loader-circle', 19)}`;
  refreshIcons();

  try {
    const base64 = await new Promise(function(resolve, reject) {
      const reader = new FileReader();

      reader.onload = function() {
        resolve(reader.result.split(',')[1]);
      };

      reader.onerror = reject;
      reader.readAsDataURL(App.audioBlob);
    });

    const mimeType = App.audioBlob.type || 'audio/webm';

    serverCall(
      'evaluateSpeaking',
      [
        App.token,
        App.currentActivity.id,
        base64,
        mimeType
      ],
      function(result) {
        if (!result || !result.success) {
          button.disabled = false;
          button.innerHTML = `<span>Evaluar mi pronunciación</span>${icon('arrow-right', 19)}`;
          refreshIcons();
          showToast(result ? result.message : 'No fue posible evaluar el audio.', 'error');
          return;
        }

        saveLocalActivityResult(App.currentActivity.id, 'Speaking', result);

        resetRecording();

        refreshDashboard(function() {
          renderActivity(App.currentActivity);
        });

        showToast('Speaking completado correctamente.', 'success');
      },
      function() {
        button.disabled = false;
        button.innerHTML = `<span>Evaluar mi pronunciación</span>${icon('arrow-right', 19)}`;
        refreshIcons();
      }
    );

  } catch (error) {
    console.error(error);
    button.disabled = false;
    button.innerHTML = `<span>Evaluar mi pronunciación</span>${icon('arrow-right', 19)}`;
    refreshIcons();
    showToast('No fue posible procesar la grabación.', 'error');
  }
}

function resetRecording() {
  const recorder = App.recorder;

  /*
   * Se eliminan los eventos antes de detener una grabación
   * que ya no corresponde a la pantalla actual.
   */
  if (recorder) {
    recorder.ondataavailable = null;
    recorder.onstop = null;
    recorder.onerror = null;

    if (recorder.state !== 'inactive') {
      try {
        recorder.stop();
      } catch (error) {
        console.warn(error);
      }
    }
  }

  if (App.recordingStream) {
    App.recordingStream.getTracks().forEach(track => track.stop());
  }

  if (App.audioUrl) {
    URL.revokeObjectURL(App.audioUrl);
  }

  App.recorder = null;
  App.audioChunks = [];
  App.audioBlob = null;
  App.audioUrl = null;
  App.recordingStream = null;
  App.recordingSkill = null;
}

function toggleTeacherLogin() {
  const panel = document.getElementById('teacher-login-panel');
  if (!panel) return;
  panel.classList.toggle('hidden');
  const isOpen = !panel.classList.contains('hidden');
  const toggle = document.querySelector('.teacher-access-toggle');
  if (toggle) toggle.setAttribute('aria-expanded', String(isOpen));
  if (isOpen) {
    const input = document.getElementById('teacher-password');
    if (input) input.focus();
  }
}

function handleTeacherLogin() {
  const input = document.getElementById('teacher-password');
  const button = document.getElementById('teacher-login-button');
  const password = input ? input.value : '';

  if (!password) {
    showToast('Ingresa la contraseña docente.', 'error');
    return;
  }

  button.disabled = true;
  button.innerHTML = `<span>Verificando...</span>${icon('loader-circle', 18)}`;
  refreshIcons();

  serverCall('loginTeacher', [password], function(result) {
    button.disabled = false;
    button.innerHTML = `<span>Ingresar al panel docente</span>${icon('arrow-right', 18)}`;
    refreshIcons();

    if (!result || !result.success) {
      showToast(result ? result.message : 'No fue posible iniciar sesión.', 'error');
      return;
    }

    App.teacherToken = result.token;
    sessionStorage.setItem('aprende_teacher_token', result.token);
    loadTeacherApplication();
  }, function() {
    button.disabled = false;
    button.innerHTML = `<span>Ingresar al panel docente</span>${icon('arrow-right', 18)}`;
    refreshIcons();
  });
}

function loadTeacherApplication() {
  showLoading();

  serverCall('getTeacherDashboard', [App.teacherToken], function(result) {
    if (!result || !result.success) {
      sessionStorage.removeItem('aprende_teacher_token');
      App.teacherToken = '';
      showLogin();
      showToast(result ? result.message : 'No fue posible validar la sesión docente.', 'error');
      return;
    }

    App.teacherData = result;
    renderTeacherLayout();
    renderTeacherDashboard();
    hideLoading();
  }, function() {
    sessionStorage.removeItem('aprende_teacher_token');
    App.teacherToken = '';
    showLogin();
  });
}

function submitCreateStudent() {
  const name = document.getElementById('new-student-name').value.trim();
  const pin = document.getElementById('new-student-pin').value.trim();
  const button = document.getElementById('create-student-button');

  if (name.length < 3) {
    showToast('Escribe el nombre completo del estudiante.', 'error');
    return;
  }
  if (!/^\d{4}$/.test(pin)) {
    showToast('El PIN debe contener exactamente cuatro números.', 'error');
    return;
  }

  button.disabled = true;
  button.innerHTML = `<span>Registrando...</span>${icon('loader-circle',18)}`;
  refreshIcons();

  serverCall('createStudent', [App.teacherToken, name, pin], function(result) {
    button.disabled = false;
    button.innerHTML = `${icon('user-plus',18)}<span>Registrar estudiante</span>`;
    refreshIcons();

    if (!result || !result.success) {
      showToast(result ? result.message : 'No fue posible registrar al estudiante.', 'error');
      return;
    }

    const student = result.student;
    document.getElementById('create-student-result').innerHTML = `
      <div class="teacher-credential">
        <strong>Estudiante registrado</strong>
        <p>${escapeHTML(student.name)} · ${escapeHTML(student.grade)}</p>
        <span>Código de acceso</span><strong>${escapeHTML(student.code)}</strong>
        <span>PIN de acceso</span><strong>${escapeHTML(student.pin)}</strong>
        <p class="page-subtitle">Entrega estos datos al estudiante. El PIN no volverá a mostrarse.</p>
        <button class="btn btn-light mt-20" onclick="copyStudentCredentials('${escapeHTML(student.code)}','${escapeHTML(student.pin)}')">${icon('copy',17)}<span>Copiar credenciales</span></button>
      </div>`;
    document.getElementById('new-student-name').value = '';
    document.getElementById('new-student-pin').value = '';
    refreshTeacherDashboard(function() {});
    refreshIcons();
    showToast('Estudiante registrado correctamente.', 'success');
  }, function() {
    button.disabled = false;
    button.innerHTML = `${icon('user-plus',18)}<span>Registrar estudiante</span>`;
    refreshIcons();
  });
}

function copyStudentCredentials(code, pin) {
  const text = 'Código: ' + code + '\nPIN: ' + pin;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function() { showToast('Credenciales copiadas.', 'success'); })
      .catch(function() { showToast('No fue posible copiar las credenciales.', 'error'); });
  } else {
    showToast(text, 'info');
  }
}

function logoutTeacher() {
  const token = App.teacherToken;
  App.teacherToken = '';
  App.teacher = null;
  App.teacherData = null;
  App.selectedTeacherStudent = null;
  sessionStorage.removeItem('aprende_teacher_token');

  serverCall('logoutTeacher', [token], function() {
    showLogin();
  }, function() {
    showLogin();
  });
}

  const token = App.token;

  stopListeningAudio();
  resetRecording();

  App.token = '';
  App.student = null;
  App.activities = [];
  App.dashboard = null;
  App.currentActivity = null;
  App.activityResults = {};

  sessionStorage.removeItem('aprende_token');

  serverCall(
    'logoutStudent',
    [token],
    function() {
      showLogin();
    },
    function() {
      showLogin();
    }
  );
}

</script>
